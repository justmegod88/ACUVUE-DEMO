<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ACUVUE Experience</title>
  <style>
    :root{
      --bg1:#135f82;
      --bg2:#0f5574;
      --card:#1a6b90;
      --card-deep:#165d7d;
      --line-soft:rgba(255,255,255,.16);
      --text:#ffffff;
      --sub:rgba(255,255,255,.86);
      --muted:rgba(255,255,255,.68);
      --shadow:0 18px 34px rgba(0,0,0,.16);
      --shadow-soft:0 8px 18px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Arial,sans-serif;
      background:#0a0a0a;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 26%),
        radial-gradient(circle at 85% 90%, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 24%),
        linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      color:var(--text);
      position:relative;
      overflow:hidden;
    }

    .app::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 30%),
        linear-gradient(90deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,0) 35%);
      pointer-events:none;
    }

    .wrap{
      position:relative;
      z-index:1;
      padding:20px 16px 28px;
    }

    .hero{
      text-align:center;
      margin-bottom:14px;
      padding:4px 8px 0;
    }

    .hero-kicker{
      display:inline-block;
      padding:7px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.88);
      font-size:12px;
      font-weight:700;
      letter-spacing:-.02em;
      margin-bottom:12px;
      backdrop-filter:blur(8px);
    }

    .hero-title{
      margin:0;
      font-size:22px;
      line-height:1.32;
      letter-spacing:-.05em;
      font-weight:800;
      word-break:keep-all;
    }

    .hero-desc{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      letter-spacing:-.02em;
      word-break:keep-all;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
    }

    .card{
      position:relative;
      display:block;
      text-decoration:none;
      color:inherit;
      border-radius:28px;
      padding:0;
      overflow:visible;
      -webkit-tap-highlight-color:transparent;
    }

    .card:active{
      transform:scale(.992);
    }

    .card-shell{
      position:relative;
      min-height:208px;
      border-radius:28px;
      padding:18px 18px 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.02) 100%),
        linear-gradient(180deg, var(--card) 0%, var(--card-deep) 100%);
      border:2px solid var(--line-soft);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 28%),
        linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,0) 38%);
      pointer-events:none;
    }

    .card-shell::after{
      content:"";
      position:absolute;
      right:-34px;
      top:-34px;
      width:110px;
      height:110px;
      border-radius:50%;
      background:rgba(255,255,255,.04);
      filter:blur(5px);
      pointer-events:none;
    }

    .card-index{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:54px;
      height:34px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.92);
      font-size:16px;
      font-weight:800;
      letter-spacing:.02em;
      margin-bottom:12px;
      backdrop-filter:blur(8px);
    }

    .card-copy{
      position:relative;
      z-index:1;
      max-width:60%;
      padding-bottom:34px;
    }

    .card-title{
      margin:0;
      font-size:32px;
      line-height:1.02;
      letter-spacing:-.06em;
      font-weight:900;
      white-space:pre-line;
      word-break:keep-all;
      text-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .card-sub{
      margin-top:12px;
      font-size:14px;
      line-height:1.35;
      letter-spacing:-.03em;
      color:var(--sub);
      word-break:keep-all;
    }

    .card-arrow{
      position:absolute;
      right:16px;
      bottom:14px;
      z-index:3;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px 8px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:var(--shadow-soft);
      color:rgba(255,255,255,.92);
      font-size:12px;
      font-weight:800;
      letter-spacing:-.02em;
      backdrop-filter:blur(8px);
    }

    .card-arrow::before{
      content:"→";
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:20px;
      height:20px;
      border-radius:50%;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      font-size:11px;
      font-weight:900;
      line-height:1;
      flex:0 0 20px;
    }

    .product-stack{
      position:absolute;
      right:-6px;
      bottom:-8px;
      width:126px;
      height:100px;
      z-index:2;
      pointer-events:none;
    }

    .pack-back,
    .pack-front{
      position:absolute;
      border:2px solid rgba(8,33,49,.40);
      border-radius:16px;
      background:linear-gradient(180deg,#2f89b1 0%, #1b6789 100%);
      box-shadow:0 12px 22px rgba(0,0,0,.14);
    }

    .pack-back{
      width:78px;
      height:60px;
      right:30px;
      bottom:18px;
      opacity:.95;
    }

    .pack-front{
      width:92px;
      height:68px;
      right:0;
      bottom:0;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .pack-front img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .pack-label{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
      color:rgba(255,255,255,.95);
      font-size:14px;
      line-height:1.15;
      text-align:center;
      font-weight:700;
      letter-spacing:-.04em;
      background:linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 100%);
    }

    .lens-orb{
      position:absolute;
      right:48px;
      top:34px;
      width:78px;
      height:78px;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.28) 24%, rgba(255,255,255,.12) 45%, rgba(255,255,255,.04) 66%, rgba(255,255,255,0) 72%);
      opacity:.82;
      box-shadow:
        inset 0 0 12px rgba(255,255,255,.22),
        0 14px 22px rgba(0,0,0,.10);
      pointer-events:none;
    }

    .lens-orb::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,.03) 58%, rgba(255,255,255,0) 76%);
    }

    .lens-orb.small{
      width:68px;
      height:68px;
      right:52px;
      top:42px;
      opacity:.78;
    }

    .footer-note{
      margin-top:16px;
      text-align:center;
      color:rgba(255,255,255,.62);
      font-size:11px;
      line-height:1.45;
      letter-spacing:-.01em;
    }

    @media (max-width:390px){
      .wrap{
        padding:16px 12px 24px;
      }
      .hero-title{
        font-size:20px;
      }
      .hero-desc{
        font-size:12px;
      }
      .card-shell{
        min-height:192px;
        padding:16px;
        border-radius:24px;
      }
      .card-copy{
        max-width:60%;
        padding-bottom:28px;
      }
      .card-title{
        font-size:29px;
      }
      .card-sub{
        font-size:13px;
        margin-top:10px;
      }
      .card-arrow{
        right:14px;
        bottom:12px;
        font-size:11px;
      }
      .product-stack{
        width:116px;
        height:92px;
      }
      .pack-back{
        width:72px;
        height:56px;
        right:28px;
        bottom:16px;
      }
      .pack-front{
        width:86px;
        height:64px;
      }
      .pack-label{
        font-size:13px;
      }
      .lens-orb{
        width:70px;
        height:70px;
        right:42px;
        top:32px;
      }
      .lens-orb.small{
        width:62px;
        height:62px;
        right:46px;
        top:38px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="wrap">

      <section class="hero">
        <div class="hero-kicker">ACUVUE Interactive Experience</div>
        <h1 class="hero-title">아큐브 기술력을<br>직접 체험해 보세요</h1>
        <p class="hero-desc">
          난시와 멀티포컬 기술력을 확인할 수 있습니다.
        </p>
      </section>

      <section class="cards">

        <a class="card" href="https://justmegod88.github.io/ACUVUE-PRODUCT/">
          <div class="card-shell">
            <div class="card-index">01</div>

            <div class="card-copy">
              <h2 class="card-title">저녁에도
선명한 시야</h2>
              <div class="card-sub">아큐브 난시 기술력</div>
            </div>

            <div class="lens-orb small"></div>

            <div class="product-stack">
              <div class="pack-back"></div>
              <div class="pack-front">
                <div class="pack-label">난시 제품</div>
              </div>
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

        <a class="card" href="https://justmegod88.github.io/MF-3D/">
          <div class="card-shell">
            <div class="card-index">02</div>

            <div class="card-copy">
              <h2 class="card-title">모든 거리
선명한 시야</h2>
              <div class="card-sub">아큐브 멀티포컬 기술력</div>
            </div>

            <div class="lens-orb"></div>

            <div class="product-stack">
              <div class="pack-back"></div>
              <div class="pack-front">
                <div class="pack-label">멀티포컬<br>제품</div>
              </div>
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

      </section>

      <div class="footer-note">
        원하는 카드를 선택하면 각 체험 페이지로 이동합니다.
      </div>

    </div>
  </main>
</body>
</html>
