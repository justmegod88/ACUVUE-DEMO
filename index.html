<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ACUVUE Experience</title>
  <style>
    :root{
      --acuvue-blue:#005EB8;
      --acuvue-blue-deep:#004A93;
      --acuvue-line:#C9DDF3;
      --acuvue-text:#143A63;
      --acuvue-sub:#55738F;
      --shadow:0 16px 30px rgba(0,74,147,.10);
      --shadow-soft:0 8px 18px rgba(0,74,147,.08);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Arial,sans-serif;
      background:#edf5fc;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 8%, rgba(0,94,184,.08) 0%, rgba(0,94,184,0) 24%),
        radial-gradient(circle at 85% 88%, rgba(0,94,184,.06) 0%, rgba(0,94,184,0) 20%),
        linear-gradient(180deg,#F6FBFF 0%, #EEF6FD 42%, #EAF4FF 100%);
      color:var(--acuvue-text);
      position:relative;
      overflow:hidden;
    }

    .app::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 30%),
        linear-gradient(90deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 30%);
      pointer-events:none;
    }

    .wrap{
      position:relative;
      z-index:1;
      padding:18px 14px 26px;
    }

    .hero{
      text-align:center;
      margin-bottom:12px;
      padding:2px 4px 0;
    }

    .hero-kicker{
      display:inline-block;
      padding:7px 12px;
      border-radius:999px;
      border:1px solid #D5E5F6;
      background:rgba(255,255,255,.9);
      color:var(--acuvue-blue);
      font-size:12px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:12px;
      box-shadow:0 6px 14px rgba(0,94,184,.06);
    }

    .hero-title{
      margin:0;
      font-size:22px;
      line-height:1.3;
      letter-spacing:-.05em;
      font-weight:900;
      color:var(--acuvue-blue-deep);
      word-break:keep-all;
    }

    .hero-desc{
      margin:9px 0 0;
      color:var(--acuvue-sub);
      font-size:13px;
      line-height:1.45;
      letter-spacing:-.02em;
      word-break:keep-all;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:12px;
    }

    .card{
      position:relative;
      display:block;
      text-decoration:none;
      color:inherit;
      border-radius:26px;
      padding:0;
      overflow:visible;
      -webkit-tap-highlight-color:transparent;
    }

    .card:active{
      transform:scale(.992);
    }

    .card-shell{
      position:relative;
      min-height:210px; /* 기존보다 아주 조금 증가 */
      border-radius:26px;
      padding:16px 16px 16px;
      background:
        radial-gradient(circle at 85% 18%, rgba(0,94,184,.08) 0%, rgba(0,94,184,0) 18%),
        linear-gradient(180deg,#FFFFFF 0%, #F7FBFF 100%);
      border:1.5px solid var(--acuvue-line);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 42%);
      pointer-events:none;
    }

    .card-shell::after{
      content:"";
      position:absolute;
      right:-28px;
      top:-28px;
      width:92px;
      height:92px;
      border-radius:50%;
      background:rgba(0,94,184,.05);
      filter:blur(4px);
      pointer-events:none;
    }

    .card-index{
      position:relative;
      z-index:2;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:50px;
      height:32px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid #D4E5F6;
      background:#F4FAFF;
      color:var(--acuvue-blue);
      font-size:15px;
      font-weight:900;
      letter-spacing:.02em;
      margin-bottom:12px;
    }

    .card-copy{
      position:relative;
      z-index:2;
      max-width:57%;
      padding-bottom:30px;
    }

    .card-title{
      margin:0;
      font-size:31px;
      line-height:1.03;
      letter-spacing:-.06em;
      font-weight:900;
      white-space:pre-line;
      word-break:keep-all;
      color:var(--acuvue-blue-deep);
    }

    .card-sub{
      margin-top:11px;
      font-size:14px;
      line-height:1.35;
      letter-spacing:-.03em;
      color:var(--acuvue-sub);
      word-break:keep-all;
    }

    .card-arrow{
      position:absolute;
      right:14px;
      bottom:12px;
      z-index:3;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px 8px 10px;
      border-radius:999px;
      background:linear-gradient(180deg,var(--acuvue-blue) 0%, var(--acuvue-blue-deep) 100%);
      box-shadow:0 8px 16px rgba(0,94,184,.22);
      color:#fff;
      font-size:12px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .card-arrow::before{
      content:"→";
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:20px;
      height:20px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.22);
      font-size:11px;
      font-weight:900;
      line-height:1;
      flex:0 0 20px;
    }

    /* 우측 팩샷 이미지 영역 */
    .card-packshot{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-52%);
      width:130px;
      height:130px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1;
      pointer-events:none;
    }

    .card-packshot img{
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 10px 16px rgba(0,94,184,.14));
    }

    .footer-note{
      margin-top:14px;
      text-align:center;
      color:#6E8BA8;
      font-size:11px;
      line-height:1.45;
      letter-spacing:-.01em;
    }

    @media (max-width:390px){
      .wrap{
        padding:16px 12px 22px;
      }
      .hero-title{
        font-size:20px;
      }
      .hero-desc{
        font-size:12px;
      }
      .card-shell{
        min-height:198px;
        padding:15px;
        border-radius:23px;
      }
      .card-title{
        font-size:28px;
      }
      .card-sub{
        font-size:13px;
      }
      .card-copy{
        max-width:57%;
        padding-bottom:26px;
      }
      .card-arrow{
        right:12px;
        bottom:11px;
        font-size:11px;
      }
      .card-packshot{
        right:12px;
        width:116px;
        height:116px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="wrap">

      <section class="hero">
        <div class="hero-kicker">ACUVUE Interactive Experience</div>
        <h1 class="hero-title">아큐브 기술력을<br>직접 체험해 보세요</h1>
        <p class="hero-desc">
          난시와 멀티포컬 기술력을 확인할 수 있습니다.
        </p>
      </section>

      <section class="cards">

        <a class="card" href="https://justmegod88.github.io/ACUVUE-PRODUCT/">
          <div class="card-shell">
            <div class="card-index">01</div>

            <div class="card-copy">
              <h2 class="card-title">저녁에도
선명한 시야</h2>
              <div class="card-sub">아큐브 난시 기술력</div>
            </div>

            <div class="card-packshot">
              <img src="astig.png" alt="난시 제품 팩샷" />
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

        <a class="card" href="https://justmegod88.github.io/MF-3D/">
          <div class="card-shell">
            <div class="card-index">02</div>

            <div class="card-copy">
              <h2 class="card-title">모든 거리
선명한 시야</h2>
              <div class="card-sub">아큐브 멀티포컬 기술력</div>
            </div>

            <div class="card-packshot">
              <img src="mf.png" alt="멀티포컬 제품 팩샷" />
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

      </section>

      <div class="footer-note">
        원하는 카드를 선택하면 각 체험 페이지로 이동합니다.
      </div>

    </div>
  </main>
</body>
</html>
