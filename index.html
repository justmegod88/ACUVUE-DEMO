<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ACUVUE Experience</title>
  <style>
    :root{
      --bg1:#135f82;
      --bg2:#0f5574;
      --card:#1a6b90;
      --card-deep:#165d7d;
      --line:rgba(8,33,49,.55);
      --line-soft:rgba(255,255,255,.14);
      --text:#ffffff;
      --sub:rgba(255,255,255,.88);
      --muted:rgba(255,255,255,.72);
      --shadow:0 22px 44px rgba(0,0,0,.18);
      --shadow-soft:0 10px 24px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Arial,sans-serif;
      background:#0a0a0a;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 26%),
        radial-gradient(circle at 85% 90%, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 24%),
        linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      color:var(--text);
      position:relative;
      overflow:hidden;
    }

    .app::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 30%),
        linear-gradient(90deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,0) 35%);
      pointer-events:none;
    }

    .wrap{
      position:relative;
      z-index:1;
      padding:34px 18px 42px;
    }

    .hero{
      text-align:center;
      margin-bottom:24px;
      padding:8px 10px 2px;
    }

    .hero-kicker{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.88);
      font-size:13px;
      font-weight:700;
      letter-spacing:-.02em;
      margin-bottom:16px;
      backdrop-filter:blur(8px);
    }

    .hero-title{
      margin:0;
      font-size:29px;
      line-height:1.28;
      letter-spacing:-.05em;
      font-weight:800;
      word-break:keep-all;
    }

    .hero-desc{
      margin:12px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
      letter-spacing:-.02em;
      word-break:keep-all;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:22px;
      margin-top:22px;
    }

    .card{
      position:relative;
      display:block;
      text-decoration:none;
      color:inherit;
      border-radius:34px;
      padding:0;
      overflow:visible;
      -webkit-tap-highlight-color:transparent;
    }

    .card:active{
      transform:scale(.992);
    }

    .card-shell{
      position:relative;
      min-height:252px;
      border-radius:34px;
      padding:28px 22px 26px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.02) 100%),
        linear-gradient(180deg, var(--card) 0%, var(--card-deep) 100%);
      border:2px solid var(--line-soft);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 28%),
        linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,0) 38%);
      pointer-events:none;
    }

    .card-shell::after{
      content:"";
      position:absolute;
      right:-40px;
      top:-40px;
      width:140px;
      height:140px;
      border-radius:50%;
      background:rgba(255,255,255,.05);
      filter:blur(6px);
      pointer-events:none;
    }

    .card-index{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:52px;
      height:34px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.92);
      font-size:15px;
      font-weight:800;
      letter-spacing:.02em;
      margin-bottom:18px;
      backdrop-filter:blur(8px);
    }

    .card-copy{
      position:relative;
      z-index:1;
      max-width:66%;
    }

    .card-title{
      margin:0;
      font-size:45px;
      line-height:1.04;
      letter-spacing:-.06em;
      font-weight:900;
      white-space:pre-line;
      word-break:keep-all;
      text-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .card-sub{
      margin-top:18px;
      font-size:20px;
      line-height:1.35;
      letter-spacing:-.03em;
      color:var(--sub);
      word-break:keep-all;
    }

    .card-arrow{
      position:absolute;
      left:22px;
      bottom:22px;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:rgba(255,255,255,.86);
      font-size:14px;
      font-weight:700;
      letter-spacing:-.02em;
    }

    .card-arrow::before{
      content:"";
      width:28px;
      height:28px;
      border-radius:50%;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:var(--shadow-soft);
    }

    .card-arrow::after{
      content:"→";
      position:absolute;
      left:8px;
      font-size:15px;
      font-weight:900;
      line-height:1;
    }

    .product-stack{
      position:absolute;
      right:-8px;
      bottom:-10px;
      width:164px;
      height:132px;
      z-index:2;
      pointer-events:none;
    }

    .pack-back,
    .pack-front{
      position:absolute;
      border:2px solid rgba(8,33,49,.48);
      border-radius:18px;
      background:linear-gradient(180deg,#2f89b1 0%, #1b6789 100%);
      box-shadow:0 14px 28px rgba(0,0,0,.16);
    }

    .pack-back{
      width:102px;
      height:78px;
      right:38px;
      bottom:22px;
      opacity:.95;
    }

    .pack-front{
      width:118px;
      height:86px;
      right:0;
      bottom:0;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .pack-front img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .pack-label{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
      color:rgba(255,255,255,.95);
      font-size:18px;
      line-height:1.15;
      text-align:center;
      font-weight:700;
      letter-spacing:-.04em;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 100%);
    }

    .lens-orb{
      position:absolute;
      right:58px;
      top:44px;
      width:100px;
      height:100px;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.28) 24%, rgba(255,255,255,.12) 45%, rgba(255,255,255,.04) 66%, rgba(255,255,255,0) 72%);
      filter:blur(.2px);
      opacity:.88;
      box-shadow:
        inset 0 0 14px rgba(255,255,255,.24),
        0 20px 30px rgba(0,0,0,.12);
      pointer-events:none;
    }

    .lens-orb::before{
      content:"";
      position:absolute;
      inset:16px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,.03) 58%, rgba(255,255,255,0) 76%);
    }

    .lens-orb.small{
      width:86px;
      height:86px;
      right:62px;
      top:54px;
      opacity:.8;
    }

    .footer-note{
      margin-top:28px;
      text-align:center;
      color:rgba(255,255,255,.62);
      font-size:12px;
      line-height:1.5;
      letter-spacing:-.01em;
    }

    @media (max-width:390px){
      .wrap{
        padding:26px 14px 36px;
      }
      .hero-title{
        font-size:25px;
      }
      .hero-desc{
        font-size:14px;
      }
      .card-shell{
        min-height:228px;
        padding:22px 18px 22px;
        border-radius:28px;
      }
      .card-copy{
        max-width:66%;
      }
      .card-title{
        font-size:37px;
      }
      .card-sub{
        font-size:18px;
        margin-top:14px;
      }
      .product-stack{
        width:148px;
        height:118px;
        right:-6px;
        bottom:-8px;
      }
      .pack-back{
        width:92px;
        height:70px;
        right:34px;
        bottom:20px;
      }
      .pack-front{
        width:108px;
        height:78px;
      }
      .pack-label{
        font-size:16px;
      }
      .lens-orb{
        width:88px;
        height:88px;
        right:52px;
        top:42px;
      }
      .lens-orb.small{
        width:76px;
        height:76px;
        right:56px;
        top:50px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="wrap">

      <section class="hero">
        <div class="hero-kicker">ACUVUE Interactive Experience</div>
        <h1 class="hero-title">아큐브 기술력을<br>직접 체험해 보세요</h1>
        <p class="hero-desc">
          난시와 멀티포컬 기술력을 확인할 수 있습니다.
        </p>
      </section>

      <section class="cards">

        <!-- 01 -->
        <a class="card" href="https://justmegod88.github.io/ACUVUE-PRODUCT/">
          <div class="card-shell">
            <div class="card-index">01</div>

            <div class="card-copy">
              <h2 class="card-title">저녁에도
선명한 시야</h2>
              <div class="card-sub">아큐브 난시 기술력</div>
            </div>

            <div class="lens-orb small"></div>

            <div class="product-stack">
              <div class="pack-back"></div>
              <div class="pack-front">
                <div class="pack-label">난시 제품</div>
              </div>
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

        <!-- 02 -->
        <a class="card" href="https://justmegod88.github.io/MF-3D/">
          <div class="card-shell">
            <div class="card-index">02</div>

            <div class="card-copy">
              <h2 class="card-title">모든 거리
선명한 시야</h2>
              <div class="card-sub">아큐브 멀티포컬 기술력</div>
            </div>

            <div class="lens-orb"></div>

            <div class="product-stack">
              <div class="pack-back"></div>
              <div class="pack-front">
                <div class="pack-label">멀티포컬<br>제품</div>
              </div>
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

      </section>

      <div class="footer-note">
        원하는 카드를 선택하면 각 체험 페이지로 이동합니다.
      </div>

    </div>
  </main>
</body>
</html>
