<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ACUVUE Experience</title>
  <style>
    :root{
      --acuvue-blue:#005EB8;
      --acuvue-blue-deep:#004A93;
      --acuvue-blue-soft:#2F7FD3;
      --acuvue-line:#C9DDF3;
      --acuvue-line-soft:#DCEAF8;
      --acuvue-text:#143A63;
      --acuvue-sub:#5B7894;
      --acuvue-bg:#EEF6FD;
      --white:#ffffff;
      --shadow:0 18px 34px rgba(0,74,147,.10);
      --shadow-soft:0 10px 22px rgba(0,74,147,.08);
      --shadow-btn:0 10px 18px rgba(0,94,184,.18);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Arial,sans-serif;
      background:var(--acuvue-bg);
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(0,94,184,.07) 0%, rgba(0,94,184,0) 24%),
        radial-gradient(circle at 88% 90%, rgba(0,94,184,.05) 0%, rgba(0,94,184,0) 18%),
        linear-gradient(180deg,#F7FBFF 0%, #EEF6FD 44%, #EAF3FC 100%);
      color:var(--acuvue-text);
    }

    .app::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.58) 0%, rgba(255,255,255,0) 28%),
        linear-gradient(90deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 26%);
    }

    .wrap{
      position:relative;
      z-index:1;
      padding:18px 14px 28px;
    }

    .hero{
      text-align:center;
      padding:2px 6px 0;
      margin-bottom:14px;
    }

    .hero-kicker{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:8px 18px;
      border-radius:999px;
      border:1.5px solid #D7E7F7;
      background:rgba(255,255,255,.92);
      color:var(--acuvue-blue);
      font-size:12px;
      font-weight:800;
      letter-spacing:-.02em;
      box-shadow:0 8px 16px rgba(0,94,184,.06);
      margin-bottom:14px;
    }

    .hero-title{
      margin:0;
      font-size:24px;
      line-height:1.28;
      letter-spacing:-.05em;
      font-weight:900;
      color:var(--acuvue-blue-deep);
      word-break:keep-all;
    }

    .hero-desc{
      margin:10px 0 0;
      color:var(--acuvue-sub);
      font-size:13px;
      line-height:1.5;
      letter-spacing:-.02em;
      word-break:keep-all;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
    }

    .card{
      position:relative;
      display:block;
      text-decoration:none;
      color:inherit;
      border-radius:30px;
      -webkit-tap-highlight-color:transparent;
    }

    .card:active{
      transform:scale(.992);
    }

    .card-shell{
      position:relative;
      min-height:232px;
      border-radius:30px;
      padding:18px 18px 18px;
      border:1.5px solid var(--acuvue-line);
      background:
        radial-gradient(circle at 88% 20%, rgba(0,94,184,.055) 0%, rgba(0,94,184,0) 18%),
        linear-gradient(180deg,#FFFFFF 0%, #F8FBFF 100%);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-shell::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,0) 42%);
    }

    .card-shell::after{
      content:"";
      position:absolute;
      right:-22px;
      top:-22px;
      width:88px;
      height:88px;
      border-radius:50%;
      background:rgba(0,94,184,.045);
      filter:blur(4px);
      pointer-events:none;
    }

    .card-index{
      position:relative;
      z-index:2;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:58px;
      height:36px;
      padding:0 14px;
      border-radius:999px;
      border:1.5px solid #D5E6F7;
      background:#F5FAFF;
      color:var(--acuvue-blue);
      font-size:16px;
      font-weight:900;
      letter-spacing:.02em;
      margin-bottom:14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    }

    .card-copy{
      position:relative;
      z-index:2;
      max-width:56%;
      padding-bottom:30px;
    }

    .card-title{
      margin:0;
      font-size:34px;
      line-height:1.02;
      letter-spacing:-.065em;
      font-weight:900;
      white-space:pre-line;
      word-break:keep-all;
      color:var(--acuvue-blue-deep);
    }

    .card-sub{
      margin-top:12px;
      font-size:14px;
      line-height:1.4;
      letter-spacing:-.03em;
      color:var(--acuvue-sub);
      word-break:keep-all;
    }

    .card-packshot{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-52%);
      width:136px;
      height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1;
      pointer-events:none;
    }

    .card-packshot::before{
      content:"";
      position:absolute;
      inset:10px 8px 12px 10px;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(234,244,255,.66) 0%, rgba(255,255,255,.18) 100%);
      border:1px dashed rgba(0,94,184,.10);
      opacity:.45;
    }

    .card-packshot img{
      position:relative;
      z-index:1;
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
      display:block;
      filter:drop-shadow(0 12px 18px rgba(0,94,184,.16));
    }

    .card-arrow{
      position:absolute;
      right:16px;
      bottom:14px;
      z-index:3;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 14px 9px 11px;
      border-radius:999px;
      background:linear-gradient(180deg,var(--acuvue-blue) 0%, var(--acuvue-blue-deep) 100%);
      color:#fff;
      font-size:12px;
      font-weight:800;
      letter-spacing:-.02em;
      box-shadow:var(--shadow-btn);
    }

    .card-arrow::before{
      content:"→";
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:21px;
      height:21px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.24);
      font-size:11px;
      font-weight:900;
      line-height:1;
      flex:0 0 21px;
    }

    .footer-note{
      margin-top:16px;
      text-align:center;
      color:#7490AB;
      font-size:11px;
      line-height:1.5;
      letter-spacing:-.01em;
    }

    @media (max-width:390px){
      .wrap{
        padding:16px 12px 24px;
      }

      .hero-title{
        font-size:22px;
      }

      .hero-desc{
        font-size:12px;
      }

      .card-shell{
        min-height:220px;
        border-radius:26px;
        padding:16px;
      }

      .card-index{
        min-width:54px;
        height:34px;
        font-size:15px;
        margin-bottom:12px;
      }

      .card-copy{
        max-width:56%;
        padding-bottom:26px;
      }

      .card-title{
        font-size:31px;
      }

      .card-sub{
        font-size:13px;
      }

      .card-packshot{
        right:12px;
        width:124px;
        height:138px;
      }

      .card-arrow{
        right:14px;
        bottom:12px;
        font-size:11px;
        padding:8px 13px 8px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="wrap">

      <section class="hero">
        <div class="hero-kicker">ACUVUE Interactive Experience</div>
        <h1 class="hero-title">아큐브 기술력을<br>직접 체험해 보세요</h1>
        <p class="hero-desc">난시와 멀티포컬 기술력을 확인할 수 있습니다.</p>
      </section>

      <section class="cards">

        <a class="card" href="./ASTIG/">
          <div class="card-shell">
            <div class="card-index">01</div>

            <div class="card-copy">
              <h2 class="card-title">저녁까지
선명한 시야</h2>
              <div class="card-sub">아큐브 난시 기술력</div>
            </div>

            <div class="card-packshot">
              <img src="astig.png" alt="난시 제품 팩샷" />
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

        <a class="card" href="./MF/">
          <div class="card-shell">
            <div class="card-index">02</div>

            <div class="card-copy">
              <h2 class="card-title">모든거리
선명한 시야</h2>
              <div class="card-sub">아큐브 멀티포컬 기술력</div>
            </div>

            <div class="card-packshot">
              <img src="mf.png" alt="멀티포컬 제품 팩샷" />
            </div>

            <div class="card-arrow">체험 시작</div>
          </div>
        </a>

      </section>

      <div class="footer-note">
        원하는 카드를 선택하면 각 체험 페이지로 이동합니다.
      </div>

    </div>
  </main>
</body>
</html>
